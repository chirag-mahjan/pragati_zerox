name: Daily notice update

on:
  schedule:
    # 08:00 India time. This clock does not change with daylight saving.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-updates.mjs
      - name: Commit notice changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/updates.json
          if git diff --cached --quiet; then
            echo "No notice changes."
            exit 0
          fi
          git commit -m "Update exam notices and schemes."
          git push
